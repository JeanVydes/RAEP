[workspace]
members = [
    "raep-types",
    "raep-domain",
    "raep-ports",
    "raep-application",
    "raep-memory", "raep-core",
    "raep-conformance",
    "raep-transport",
    "raep-server",
    "raep-http",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
